<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FBF7EC">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>可心开赛车</title>
<style>
  :root{
    --paper:#FBF7EC; --paper2:#F4EDDC; --card:#FFFDF6;
    --ink:#3E5A4B; --faint:#8A9A8B; --line:#DED6BE;
    --grass:#DDE9CE; --grass2:#C9DEB6; --road:#E9E1CD;
    --seal:#C4543F; --red:#D96A52; --sun:#F2C14E;
    --sky:#8FC2D4; --pink:#E8A9A0; --mint:#8FBF9F;
    --hei:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --kai:"KaiTi","STKaiti","Kaiti SC",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#EDE6D4}
  body{font-family:var(--hei);color:var(--ink);user-select:none;-webkit-user-select:none}
  .wrap{max-width:480px;margin:0 auto;height:100vh;height:100dvh;min-height:100%;display:flex;flex-direction:column;
        background:var(--paper);box-shadow:0 0 34px rgba(62,90,75,.16);position:relative;overflow:hidden}
  header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px 8px;
         padding-top:calc(10px + env(safe-area-inset-top))}
  .seal{width:38px;height:38px;flex:none;border:2px solid var(--seal);border-radius:11px;color:var(--seal);
        font-family:var(--kai);font-size:23px;line-height:34px;text-align:center;transform:rotate(-6deg)}
  .brand{flex:1;min-width:0}
  .brand h1{font-family:var(--kai);font-size:21px;margin:0;letter-spacing:2px;line-height:1.2}
  .brand p{margin:2px 0 0;font-size:11px;color:var(--faint);letter-spacing:1px}
  .icon-btn{width:40px;height:40px;flex:none;border:2px solid var(--line);background:var(--card);
            border-radius:13px;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 0 var(--line)}
  .icon-btn:active{transform:translateY(2px);box-shadow:none}
  .icon-btn svg{width:21px;height:21px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn.off{opacity:.5}

  /* 关卡地图 */
  .lv-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;
          margin:10px 0 10px;max-height:min(34vh,215px);overflow-y:auto;padding:2px;
          scrollbar-width:thin}
  @media(min-width:600px){.lv-map{grid-template-columns:repeat(5,minmax(0,1fr));max-height:210px}}
  .lv{position:relative;border:2px solid var(--line);background:var(--paper2);
      border-radius:14px;padding:9px 9px 8px;text-align:left;cursor:pointer;
      transition:transform .12s,box-shadow .12s;font-family:inherit;color:inherit}
  .lv:active{transform:translateY(2px)}
  .lv .n{font-size:10px;color:var(--faint);letter-spacing:1px}
  .lv .t{font-family:var(--kai);font-size:18px;letter-spacing:1px;margin:2px 0 3px;line-height:1.2}
  .lv .g{font-size:10.5px;color:var(--soft)}
  .lv .best{font-size:10px;color:#4F7A55;margin-top:3px;min-height:12px}
  .lv.cur{border-color:var(--ink);background:#FFF3D4;box-shadow:0 3px 0 var(--ink)}
  .lv.done{background:#E7F2DF;border-color:var(--mint)}
  .lv.lock{opacity:.46;cursor:not-allowed}
  .lv .mark{position:absolute;right:7px;top:7px;width:16px;height:16px}
  .map-tip{font-size:11px;color:var(--faint);margin:0;line-height:1.6}
  .car-pick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 0}
  .car-btn{background:var(--paper2);border:2px solid var(--line);border-radius:11px;
    padding:4px 6px 3px;cursor:pointer;opacity:.82;transition:transform .12s,opacity .12s}
  .car-btn.on{border-color:#C4543F;opacity:1;box-shadow:0 0 0 3px rgba(196,84,63,.18)}
  .car-btn:active{transform:scale(.94)}
  .car-btn canvas{display:block;margin:0 auto}
  .car-btn .cname{font-size:11px;color:var(--ink);margin-top:2px}
  .car-btn.on .cname{color:#C4543F;font-weight:700}
  /* 知识卡：不暂停，底部横幅边开边听 */
  #knowCard{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);
    width:min(88%,350px);background:#FFFDF4;border:2.5px solid #7FA8D9;border-radius:16px;
    box-shadow:0 6px 0 rgba(62,74,75,.12);padding:9px 12px;z-index:9;
    display:flex;align-items:center;gap:8px;animation:pop .25s ease}
  #knowCard.hide{display:none}
  #knowCard .ktag{display:inline-block;background:#7FA8D9;color:#FFFDF4;font-size:11px;
    padding:2px 9px;border-radius:20px;letter-spacing:2px;flex:0 0 auto}
  #knowCard .kico{flex:0 0 auto}
  #knowCard .ktext{font-family:var(--kai);font-size:14px;line-height:1.55;color:var(--ink);
    margin:0;flex:1 1 auto;text-align:left}
  #knowCard .kclose{flex:0 0 auto;padding:6px 10px;border:none;border-radius:10px;background:#7FA8D9;
    color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  #knowCard .kclose:active{transform:scale(.95)}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .btn-row{display:flex;gap:8px;margin-top:9px}
  .smallbtn{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);
            border-radius:13px;padding:10px 6px;font-size:13px;font-family:inherit;
            font-weight:600;cursor:pointer}
  .smallbtn:active{transform:translateY(2px)}
  .hud-lv{font-size:11px;color:var(--soft);background:var(--paper2);
          border-radius:999px;padding:3px 9px;margin-right:2px;white-space:nowrap}

  .hud{flex:none;margin:2px 14px 8px;background:var(--card);border:2px solid var(--line);
       border-radius:16px;padding:9px 12px 10px;box-shadow:0 3px 0 var(--line)}
  .hud-top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
  .hud-top .num{font-family:var(--kai);font-size:22px;color:var(--seal);line-height:1}
  .hud-top .goal{color:var(--faint);font-weight:400;font-size:12px}
  .hud-top .spacer{flex:1}
  .hud-top .bumps{font-size:12px;color:var(--faint);font-weight:400}
  .track{margin-top:8px;height:14px;background:var(--paper2);border-radius:9px;position:relative;
         border:1.5px solid var(--line);overflow:visible}
  .track-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--mint),var(--sun));
              border-radius:9px;transition:width .3s ease}
  .track-car{position:absolute;top:-9px;left:0%;transform:translateX(-50%);transition:left .3s ease;
             width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(62,90,75,.25))}
  .flag{position:absolute;right:-3px;top:-11px;width:20px;height:22px}

  .stage{flex:1;min-height:240px;position:relative;
         margin:0 14px calc(14px + env(safe-area-inset-bottom));border:2px solid var(--line);
         border-radius:20px;overflow:hidden;background:var(--grass)}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  .card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;
        background:rgba(251,247,236,.90);backdrop-filter:blur(2px);
        overflow-y:auto;-webkit-overflow-scrolling:touch}
  .card.hide{display:none}
  .panel{width:100%;max-width:330px;background:var(--card);border:2.5px solid var(--ink);
         border-radius:22px;padding:18px 18px 16px;text-align:center;
         box-shadow:5px 6px 0 rgba(62,90,75,.18);position:relative;margin:auto}
  .panel:before{content:"";position:absolute;inset:5px;border:1.5px dashed var(--line);border-radius:16px;pointer-events:none}
  .panel .stamp{font-family:var(--kai);font-size:15px;color:var(--seal);letter-spacing:3px;margin-bottom:6px}
  .panel h2{font-family:var(--kai);font-size:30px;margin:0 0 8px;letter-spacing:3px}
  .panel .desc{font-size:13px;line-height:1.85;color:#617568;margin:0 0 14px}
  .how{display:flex;gap:8px;justify-content:center;margin:0 0 18px}
  .how div{flex:1;background:var(--paper2);border:1.5px solid var(--line);border-radius:13px;padding:9px 4px 8px}
  .how svg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .how span{display:block;font-size:11px;margin-top:4px;color:#617568}
  .bigbtn{width:100%;border:none;border-radius:16px;padding:15px 10px;background:var(--red);color:#fff;
          font-family:var(--kai);font-size:21px;letter-spacing:3px;cursor:pointer;
          box-shadow:0 4px 0 #A94836;transition:transform .08s}
  .bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #A94836}
  .bigbtn.green{background:var(--mint);box-shadow:0 4px 0 #6C9A7B}
  .bigbtn.green:active{box-shadow:0 1px 0 #6C9A7B}
  .result{margin:2px 0 16px;font-size:15px;line-height:2;color:#617568}
  .result b{font-family:var(--kai);font-size:26px;color:var(--seal)}
  .best{margin-top:10px;font-size:12px;color:var(--faint)}

  .toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-8px);background:rgba(62,90,75,.92);
         color:#fff;font-size:14px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;
         transition:opacity .25s,transform .25s;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .horn-btn{position:absolute;right:10px;bottom:12px;width:52px;height:52px;border-radius:50%;
    border:2.5px solid var(--ink);background:var(--card);box-shadow:0 3px 0 rgba(62,90,75,.35);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;
    transition:transform .12s;-webkit-tap-highlight-color:transparent}
  .horn-btn svg{width:26px;height:26px}
  .horn-btn:active,.horn-btn.on{transform:scale(.88)}
  .horn-btn::after{content:'嘀嘀';position:absolute;top:-24px;left:50%;transform:translateX(-50%);
    font-size:11px;color:#8A6A2A;background:#FFF6E0;border:1.5px solid #E8CE96;border-radius:10px;
    padding:1px 7px;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
  .horn-btn.honk::after{opacity:1}

  @media (max-height:620px){
    header{padding-top:6px;padding-bottom:4px} .seal{width:32px;height:32px;line-height:28px;font-size:19px}
    .brand h1{font-size:18px} .hud{padding:6px 10px;margin-bottom:5px}
    .card{padding:12px} .panel{padding:13px 13px 12px} .panel h2{font-size:22px;margin-bottom:5px} .how{margin-bottom:12px}
    .panel .desc{font-size:12px;line-height:1.7;margin-bottom:10px} .lv-map{max-height:min(30vh,180px)}
  }

  /* 回目录（由 _add_home_link.py 注入） */
  .home-link{display:inline-flex;align-items:center;justify-content:center;gap:5px;
    height:38px;padding:0 11px;text-decoration:none;color:inherit;flex:none;
    background:var(--card,#FFFDF6);border:2px solid var(--line,var(--wood,#DED6BE));
    border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;
    box-shadow:0 2px 0 rgba(0,0,0,.06)}
  .home-link svg{width:17px;height:17px;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .home-link:active{transform:translateY(2px);box-shadow:none}
  @media(max-width:460px){.home-link span{display:none}.home-link{padding:0 9px;height:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal">车</div>
    <div class="brand"><h1>可心开赛车</h1><p>二十关闯关 · 一关比一关难</p></div>
    <a class="home-link" href="../" aria-label="回到目录" title="回到目录"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-6h4v6"/></svg><span>目录</span></a>
      <button class="icon-btn" id="soundBtn" aria-label="开关声音" title="声音">
      <svg viewBox="0 0 24 24" id="soundIcon"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9c1.2 1.6 1.2 4.4 0 6"/><path d="M19.5 6.5c2.6 3 2.6 8 0 11"/></svg>
    </button>
  </header>

  <div class="hud">
    <div class="hud-top">
      <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:var(--sun);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z"/></svg>
      <span class="num" id="starNum">0</span><span class="goal" id="goalTxt">/ 15</span>
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#F2C14E;stroke:#B8860B;stroke-width:1.5;margin-left:6px"><circle cx="12" cy="12" r="9"/><path d="M12 7.2l1.2 2.5 2.7.4-2 1.9.5 2.7-2.4-1.3-2.4 1.3.5-2.7-2-1.9 2.7-.4z" fill="#B8860B" stroke="none"/></svg>
      <span class="num" id="coinNum" style="color:#B8860B">0</span>
      <span class="hud-lv" id="hudLv">第 1 关</span>
      <span class="spacer"></span>
      <span class="bumps" id="bumpTxt">碰到路障 0 次</span>
    </div>
    <div class="track">
      <div class="track-fill" id="trackFill"></div>
      <svg class="track-car" id="trackCar" viewBox="0 0 32 32"><rect x="7" y="4" width="18" height="24" rx="7" fill="#D96A52" stroke="#3E5A4B" stroke-width="2"/><rect x="10" y="9" width="12" height="8" rx="3" fill="#CFE7EF" stroke="#3E5A4B" stroke-width="1.6"/><circle cx="12" cy="25" r="2" fill="#F2C14E"/><circle cx="20" cy="25" r="2" fill="#F2C14E"/></svg>
      <svg class="flag" viewBox="0 0 24 26"><path d="M6 2v22" stroke="#3E5A4B" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M7 3h13l-3 4 3 4H7z" fill="#C4543F" stroke="#3E5A4B" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <button class="horn-btn" id="hornBtn" aria-label="按喇叭"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10H4z" fill="#8A6A2A"/><path d="M15.5 9.2c1 1.4 1 4.2 0 5.6M18 7c2 2.6 2 7.4 0 10" stroke="#8A6A2A" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
    <div class="toast" id="toast"></div>
    <div class="card" id="startCard">
      <div class="panel">
        <div class="stamp">～ 选一关出发 ～</div>
        <h2>可心开赛车</h2>
        <p class="desc"><b>用手指拖着小车，左右开起来～</b><br>一关比一关难，<b>过了这关才解锁下一关</b>。<br>接星星、捡金币、躲锥桶，还有<b>礼物盒、冰淇淋、火箭加速</b>和<b>知识泡泡</b>哦。</p>
        <div class="lv-map" id="lvMap"></div>
        <p class="map-tip">十辆小车任你挑，点一点就换车～</p>
        <div class="car-pick" id="carPick"></div>
        <button class="smallbtn" id="shopBtn" style="margin-top:10px">金币小店 · 给小车挑个礼物</button>
      </div>
    </div>
    <div class="hide" id="knowCard">
      <span class="ktag">小知识</span>
      <svg class="kico" width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#D8E6F5" stroke="#7FA8D9" stroke-width="1.6"/><path d="M9.6 9.4c0-1.4 1.1-2.3 2.4-2.3 1.4 0 2.4.9 2.4 2.2 0 1-.5 1.5-1.3 2.1-.7.5-1.1.9-1.1 1.8v.3" stroke="#5B87B5" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.15" fill="#5B87B5"/></svg>
      <div class="ktext" id="knowTxt"></div>
      <button class="kclose" id="knowClose">继续开！</button>
    </div>
    <div class="card hide" id="endCard">
      <div class="panel">
        <div class="stamp" id="endStamp">～ 到终点啦 ～</div>
        <h2 id="endTitle">好棒呀！</h2>
        <div class="result" id="endResult"></div>
        <button class="bigbtn green" id="nextBtn">开下一关</button>
        <div class="btn-row">
          <button class="smallbtn" id="againBtn">再玩这关</button>
          <button class="smallbtn" id="mapBtn">回到关卡</button>
        </div>
        <div class="best" id="bestTxt"></div>
      </div>
    </div>
    <div class="card hide" id="lockCard">
      <div class="panel">
        <div class="stamp">～ 休息时间 ～</div>
        <h2 id="lockTitle">时间到啦</h2>
        <svg width="120" height="86" viewBox="0 0 120 86" aria-hidden="true" style="margin:2px auto 6px;display:block">
          <path d="M96 12a13 13 0 1 0 8 23 16 16 0 1 1-8-23z" fill="#F2C14E" stroke="#B8860B" stroke-width="2"/>
          <circle cx="24" cy="16" r="2" fill="#B8860B" opacity=".5"/><circle cx="40" cy="9" r="1.5" fill="#B8860B" opacity=".4"/>
          <rect x="34" y="42" width="52" height="26" rx="12" fill="#D96A52" stroke="#3E5A4B" stroke-width="2.4"/>
          <path d="M50 42q10-10 20 0" fill="#CFE7EF" stroke="#3E5A4B" stroke-width="2"/>
          <circle cx="47" cy="55" r="2" fill="#3E5A4B"/><circle cx="60" cy="55" r="2" fill="#3E5A4B"/>
          <path d="M46 60q3 2.4 6 0M59 60q3 2.4 6 0" stroke="#3E5A4B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <circle cx="38" cy="70" r="7" fill="#5A4632"/><circle cx="82" cy="70" r="7" fill="#5A4632"/>
          <circle cx="38" cy="70" r="2.6" fill="#CFE7EF"/><circle cx="82" cy="70" r="2.6" fill="#CFE7EF"/>
          <text x="98" y="52" font-size="13" fill="#8A9A8B" font-family="KaiTi,serif" transform="rotate(12 98 52)">z</text>
          <text x="106" y="42" font-size="17" fill="#8A9A8B" font-family="KaiTi,serif" transform="rotate(12 106 42)">z</text>
        </svg>
        <p class="desc" id="lockDesc"></p>
        <button class="bigbtn" id="lockBtn" style="background:#7A8FB5;box-shadow:0 4px 0 #5C6E93">跟蹦蹦兔拉拉勾</button>
      </div>
    </div>
  </div>

</div>

<div class="card hide" id="shopCard" style="position:fixed;inset:0;z-index:78">
  <div class="panel" style="max-width:360px">
    <div class="stamp">～ 金币小店 ～</div>
    <h2>给小车挑个礼物</h2>
    <p class="desc" id="shopCoin">现在有 0 枚金币</p>
    <div id="shopList" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px"></div>
    <p class="map-tip" style="margin:8px 0 0">金币在路上捡，攒够就能买；买过的随时换着装</p>
    <button class="bigbtn" id="shopClose" style="margin-top:12px;background:#7A8FB5;box-shadow:0 4px 0 #5C6E93">回去开车</button>
  </div>
</div>

<script src="../fun.js"></script>

<script>
(function(){
  'use strict';
  /* ---------------- 基础 ---------------- */
  /* 20 关：目标星数、落物速度、星星占比(越小锥桶越多)、落物间隔逐关变难；th=场景主题 */
  var LEVELS = [
    {name:'慢慢开',   goal:8,  speed:128, starRate:.82, gap:1.02, th:0},
    {name:'小路弯弯', goal:9,  speed:142, starRate:.78, gap:.96,  th:1},
    {name:'风轻轻',   goal:10, speed:156, starRate:.74, gap:.90,  th:2},
    {name:'追蝴蝶',   goal:11, speed:170, starRate:.70, gap:.85,  th:3},
    {name:'过小桥',   goal:12, speed:184, starRate:.66, gap:.80,  th:4},
    {name:'星星雨',   goal:13, speed:198, starRate:.62, gap:.76,  th:5},
    {name:'小山路',   goal:14, speed:212, starRate:.58, gap:.72,  th:6},
    {name:'追风啦',   goal:15, speed:226, starRate:.55, gap:.68,  th:7},
    {name:'大转弯',   goal:16, speed:240, starRate:.52, gap:.64,  th:8},

  /* ---------------- 场景氛围粒子（随主题变化） ---------------- */
  function newAmb(kind, y){
    var x = rand(0,W);
    if(kind==='snow')    return {k:kind,x:x,y:y,vx:0,vy:rand(55,105),ph:rand(0,6),r:rand(1.6,3.2)};
    if(kind==='leaf')    return {k:kind,x:x,y:y,vx:rand(-18,10),vy:rand(80,130),ph:rand(0,6),r:rand(2.6,4.4),rot:rand(0,6),vr:rand(-2.5,2.5)};
    if(kind==='rain')    return {k:kind,x:x,y:y,vx:-9,vy:rand(240,330),r:1.4};
    if(kind==='wind')    return {k:kind,x:x,y:y,vx:0,vy:rand(180,260),len:rand(14,26),r:1.2};
    if(kind==='cloud')   return {k:kind,x:x,y:y,vx:rand(-8,8),vy:rand(20,42),r:rand(9,16)};
    if(kind==='butterfly') return {k:kind,x:x,y:y,vx:0,vy:rand(26,48),ph:rand(0,6),r:rand(2.2,3.6)};
    return {k:'twinkle',x:x,y:y,ph:rand(0,6),r:rand(1,2.3)};   /* star / sparkle：原地闪烁 */
  }
  function buildAmbient(){
    ambient = [];
    var kind = (THEMES[L().th]||{}).p;
    if(!kind) return;
    var n = kind==='star'||kind==='sparkle' ? 16 : (kind==='rain' ? 22 : 13);
    for(var i=0;i<n;i++) ambient.push(newAmb(kind, Math.random()*H));
  }
  function updateAmbient(dt){
    if(!ambient.length) return;
    for(var i=0;i<ambient.length;i++){
      var a = ambient[i];
      if(a.k==='twinkle') continue;
      a.y += a.vy*dt;
      if(a.k==='snow'||a.k==='butterfly') a.x += Math.sin(elapsed*2+a.ph)*28*dt;
      if(a.k==='leaf'){ a.x += Math.sin(elapsed*1.7+a.ph)*34*dt; a.rot += a.vr*dt; }
      a.x += (a.vx||0)*dt;
      if(a.y > H+24){ ambient[i] = newAmb(a.k, -20); }
      if(a.x < -24) a.x = W+20; else if(a.x > W+24) a.x = -20;
    }
  }
  function drawAmbient(){
    var th = THEMES[L().th]||{};
    ambient.forEach(function(a){
      ctx.save();
      if(a.k==='snow'){
        ctx.globalAlpha=.9; ctx.fillStyle='#FFFFFF';
        ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill();
      }else if(a.k==='leaf'){
        ctx.globalAlpha=.85; ctx.translate(a.x,a.y); ctx.rotate(a.rot);
        ctx.fillStyle = Math.sin(a.ph)>0 ? '#D9A24A' : '#C9843E';
        ctx.beginPath(); ctx.ellipse(0,0,a.r*1.5,a.r*.75,0,0,Math.PI*2); ctx.fill();
      }else if(a.k==='rain'){
        ctx.globalAlpha=.5; ctx.strokeStyle='#B9D2E2'; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x+a.vx*.03,a.y+11); ctx.stroke();
      }else if(a.k==='wind'){
        ctx.globalAlpha=.4; ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=a.r;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(a.x+6,a.y+a.len/2,a.x,a.y+a.len); ctx.stroke();
      }else if(a.k==='cloud'){
        ctx.globalAlpha=.75; ctx.fillStyle='#FFFFFF';
        ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2);
        ctx.arc(a.x+a.r*.9,a.y+2,a.r*.72,0,Math.PI*2);
        ctx.arc(a.x-a.r*.9,a.y+3,a.r*.66,0,Math.PI*2); ctx.fill();
      }else if(a.k==='butterfly'){
        ctx.globalAlpha=.85; ctx.fillStyle='#E8A9C0';
        var f = Math.abs(Math.sin(elapsed*7+a.ph));
        ctx.beginPath(); ctx.ellipse(a.x-a.r*f,a.y,a.r,a.r*.62,-.5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(a.x+a.r*f,a.y,a.r,a.r*.62,.5,0,Math.PI*2); ctx.fill();
      }else{ /* twinkle */
        var tw = .3+.5*Math.abs(Math.sin(elapsed*1.8+a.ph));
        ctx.globalAlpha=tw; ctx.fillStyle = th.night ? '#F5EFC8' : '#F2C14E';
        ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    });
    ctx.globalAlpha=1;
  }

  var actx = null, soundOn = true;
  function initSound(){
    if(!soundOn || actx) return;
    try{
      var AC = window.AudioContext||window.webkitAudioContext;
      if(AC) actx = new AC();
    }catch(e){ actx = null; }
    if(actx && actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  }
  function tone(freq, dur, type, vol, delay, slide){
    if(!soundOn || !actx) return;
    try{
      var t0 = actx.currentTime + (delay||0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type||'sine'; o.frequency.setValueAtTime(freq,t0);
      if(slide) o.frequency.exponentialRampToValueAtTime(slide, t0+dur);
      g.gain.setValueAtTime(.0001,t0);
      g.gain.exponentialRampToValueAtTime(vol||.09, t0+.012);
      g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0+dur+.02);
    }catch(e){}
  }

  function rr(a,b,c,d,e,f){
    var g = ctx, x, y, w, h, r;
    if(a && a.beginPath){ g=a; x=b; y=c; w=d; h=e; r=f; }
    else { x=a; y=b; w=c; h=d; r=e; }
    r = Math.min(r,w/2,h/2);
    g.beginPath();
    g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.arcTo(x+w,y,x+w,y+r,r);
    g.lineTo(x+w,y+h-r); g.arcTo(x+w,y+h,x+w-r,y+h,r);
    g.lineTo(x+r,y+h); g.arcTo(x,y+h,x,y+h-r,r);
    g.lineTo(x,y+r); g.arcTo(x,y,x+r,y,r); g.closePath();
  }
  function starPath(x,y,R){

      i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }

    ctx.fillStyle='#3E5A4B';
    ctx.beginPath(); ctx.arc(-4,-1,1.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-1,1.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* ---------------- 场景绘制 ---------------- */
  var RAINBOW = ['#E8A9A0','#F0C24E','#A8CBA0','#9FC5D9','#C5A8D9','#EFC8D8'];
  function draw(){
    var th = THEMES[L().th]||THEMES[0];
    ctx.clearRect(0,0,W,H);
    /* 草地/天空 */
    ctx.fillStyle = th.g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = th.s;
    ctx.fillRect(0,0,roadL()-3,H); ctx.fillRect(roadR()+3,0,W-roadR()-3,H);
    /* 路面 */
    ctx.fillStyle = th.r; ctx.fillRect(roadL(),0,roadR()-roadL(),H);
    /* 彩虹路：淡彩横带随路面滚动 */
    if(th.rainbow){
      var band = 44, ph = offset%(band*RAINBOW.length);
      ctx.save();
      ctx.beginPath(); ctx.rect(roadL(),0,roadR()-roadL(),H); ctx.clip();
      ctx.globalAlpha=.28;
      for(var b=-1;b<Math.ceil(H/band)+1;b++){
        ctx.fillStyle = RAINBOW[((b+Math.floor(ph/band))%RAINBOW.length+RAINBOW.length)%RAINBOW.length];
        var by = b*band - (ph%band);
        ctx.fillRect(roadL(),by,roadR()-roadL(),band*.62);
      }
      ctx.restore(); ctx.globalAlpha=1;
    }
    /* 路沿 */
    ctx.strokeStyle = th.e; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(roadL(),0); ctx.lineTo(roadL(),H);
    ctx.moveTo(roadR(),0); ctx.lineTo(roadR(),H); ctx.stroke();
    /* 车道虚线 */
    ctx.strokeStyle = th.d; ctx.lineWidth = 4; ctx.setLineDash([20,20]);
    ctx.lineDashOffset = -offset%40;
    for(var k=1;k<3;k++){
      var lx = roadL() + (roadR()-roadL())*k/3;
      ctx.beginPath(); ctx.moveTo(lx,0); ctx.lineTo(lx,H); ctx.stroke();
    }
    ctx.setLineDash([]);
    /* 环境粒子（天空层） */
    drawAmbient();
    /* 路边装饰 */
    deco.forEach(function(d){
      var y = (d.y + offset*.55) % (H+80) - 40;
      if(d.kind==='tree') drawTree(d.x,y,d.s); else drawFlower(d.x,y,d.s);
    });
    /* 落下的东西 */
    items.forEach(function(it){
      if(it.type==='star'){
        ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(elapsed*1.6+it.spin);
        ctx.fillStyle='#F2C14E'; ctx.strokeStyle='#3E5A4B'; ctx.lineWidth=2; ctx.lineJoin='round';
        starPath(0,0,it.r); ctx.fill(); ctx.stroke();
        ctx.restore();
      }else if(it.type==='gift') drawGift(it.x,it.y,it.s||1);
      else if(it.type==='ice') drawIce(it.x,it.y,it.s||1);
      else if(it.type==='know') drawKnow(it.x,it.y,clamp(W*.042,13,17));
      else if(it.type==='coin') drawCoin(it.x,it.y,clamp(W*.04,12,17));
      else if(it.type==='boost') drawBoost(it.x,it.y,clamp(W*.042,13,17));
      else if(it.type==='magnet') drawMagnet(it.x,it.y,clamp(W*.042,13,17));
      else drawCone(it.x,it.y,it.s||1);
    });
    /* 小粒子 */
    parts.forEach(function(p){
      ctx.globalAlpha = clamp(p.life,0,1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    /* 玩家小车（夜晚画车灯光锥） */
    var blink = inv>0 && Math.floor(inv*10)%2===0;
    var style = CARS[myCar];
    if(th.night && !blink){
      ctx.save();
      ctx.globalAlpha=.16; ctx.fillStyle='#FFF3C4';
      ctx.beginPath();
      ctx.moveTo(player.x-player.w*.32,player.y-player.h*.45);
      ctx.lineTo(player.x-player.w*1.15,player.y-player.h*2.1);
      ctx.lineTo(player.x+player.w*1.15,player.y-player.h*2.1);
      ctx.lineTo(player.x+player.w*.32,player.y-player.h*.45);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if(!blink){ drawCar(player.x,player.y,player.w,player.h,style.body,player.tilt,'#CFE7EF',style); drawEquip(); }
    drawPeek();
    /* 飘字（+1 / 连击 / 完美） */
    floats.forEach(function(f){
      ctx.save();
      ctx.globalAlpha = clamp(f.life,0,1);
      ctx.fillStyle = f.color; ctx.strokeStyle='rgba(255,253,244,.85)'; ctx.lineWidth=3;
      ctx.font='bold 17px "KaiTi","STKaiti",serif';
      ctx.textAlign='center';
      ctx.strokeText(f.txt,f.x,f.y); ctx.fillText(f.txt,f.x,f.y);
      ctx.restore();
    });
    ctx.globalAlpha=1;
    /* 通关彩纸 */
    confetti.forEach(function(c){
      ctx.save();
      ctx.globalAlpha=clamp(c.life,0,1);
      ctx.translate(c.x,c.y); ctx.rotate(c.rot);
      ctx.fillStyle=c.color; ctx.fillRect(-c.r,-c.r*.55,c.r*2,c.r*1.1);
      ctx.restore();
    });
    ctx.globalAlpha=1;
    /* 夜幕再罩一层淡淡暗色（保留车灯亮度） */
    if(th.night){
      ctx.fillStyle='rgba(24,30,52,.18)'; ctx.fillRect(0,0,W,H);
    }
    /* 终点横线（快到时画） */
    if(stars >= GOAL-3){
      var fy = 46;
      ctx.strokeStyle='#C4543F'; ctx.lineWidth=4; ctx.setLineDash([9,9]);
      ctx.beginPath(); ctx.moveTo(roadL()+4,fy); ctx.lineTo(roadR()-4,fy); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  /* ---------------- 游戏逻辑 ---------------- */
  function spawn(){
    var laneW = (roadR()-roadL())/3;
    var lane = Math.floor(Math.random()*3);
    var x = roadL() + laneW*(lane+.5) + rand(-laneW*.18,laneW*.18);
    var roll = Math.random(), type;
    if(roll < .028) type = 'boost';
    else if(roll < .073) type = 'gift';
    else if(roll < .123) type = 'ice';
    else if(roll < .175 && knowCount < 3) type = 'know';
    else if(roll < .29) type = 'coin';
    else if(roll < .32) type = 'magnet';
    else type = Math.random() < L().starRate ? 'star' : 'cone';
    items.push({
      type: type,
      x: x, y: -40,
      r: type==='star'||type==='know'||type==='coin'||type==='boost'||type==='magnet' ? clamp(W*.04,12,17) : 0,
      s: (type==='star'||type==='know'||type==='coin'||type==='boost'||type==='magnet') ? 1 : clamp(W/340,.8,1.15),
      spin: rand(0,6),
      k: knowIdx,
      hit:false
    });
    if(type==='know') knowIdx = (knowIdx+1)%KNOWS.length;
  }
  function burst(x,y,color){
    for(var i=0;i<8;i++){
      parts.push({x:x,y:y,r:rand(2,4.5),vx:rand(-90,90),vy:rand(-140,-40),
                  life:1,color:color});
    }
  }
  function burstMany(x,y,colors,n){
    for(var i=0;i<(n||14);i++){
      parts.push({x:x,y:y,r:rand(2,5),vx:rand(-130,130),vy:rand(-190,-30),
                  life:1,color:colors[i%colors.length]});

  function addFloat(x,y,txt,color){
    floats.push({x:clamp(x,30,W-30),y:y,txt:txt,color:color||'#C4543F',life:1});

  function spawnConfetti(){
    var colors = ['#E8A9A0','#F0C24E','#A8CBA0','#9FC5D9','#C5A8D9','#EFC8D8'];
    for(var i=0;i<64;i++){
      confetti.push({x:rand(0,W),y:rand(-H*.5,-10),vx:rand(-24,24),vy:rand(70,150),
                     rot:rand(0,6),vr:rand(-4,4),r:rand(3.5,6),life:2.4,
                     color:colors[i%colors.length]});

  }
  function toast(msg){
    var t = el('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1150);

  function updateHUD(){
    el('starNum').textContent = stars;
    el('goalTxt').textContent = '/ '+GOAL;
    el('hudLv').textContent = '第'+cnNum(curLv+1)+'关 · '+L().name;

  function reset(){
    items = []; parts = []; floats = []; confetti = [];
    stars = 0; bumps = 0; inv = 0; slow = 0; boost = 0; coins = 0; peek = null; magnet = 0;
    spawnT = .55; elapsed = 0; offset = 0; combo = 0; knowCount = 0;
    player.x = W/2; player.tilt = 0;
    keys.left = keys.right = false; dragging = false;
    buildAmbient();
    updateHUD();
  }
  /* 关卡地图：通关才解锁下一关，已通关的显示最好成绩 */
  function renderMap(){
    var done = progress.best, maxOpen = progress.unlocked;
    el('lvMap').innerHTML = LEVELS.map(function(l,i){
      var locked = i > maxOpen;
      var cleared = done[i] !== undefined;
      var cls = 'lv' + (i===maxOpen?' cur':'') + (cleared?' done':'') + (locked?' lock':'');
      var mark = locked
        ? '<svg class="mark" viewBox="0 0 24 24" fill="none" stroke="#3E5A4B" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'
        : (cleared ? '<svg class="mark" viewBox="0 0 24 24" fill="'+(done[i]===0?'#F2C14E':'#6C9A7B')+'" stroke="#3E5A4B" stroke-width="1.6"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5L2.5 9.5l6.6-.9z"/></svg>' : '');
      return '<button class="'+cls+'" data-lv="'+i+'" '+(locked?'disabled':'')+'>'

        + '<div class="best">'+(cleared?(done[i]===0?'完美！0 次碰撞':'最好：碰到 '+done[i]+' 次'):(locked?'先过上一关':'还没玩过'))+'</div>'
        + '</button>';
    }).join('');
    el('lvMap').querySelectorAll('.lv:not(.lock)').forEach(function(b){

  function showMap(){
    state = 'map'; try{ player.pause(); }catch(e){}
    el('endCard').classList.add('hide');
    el('startCard').classList.remove('hide');
    renderMap();
  }
  /* ---------------- 家长时间控制（配置与其他设备时长来自云端，本机只累计自己这一份） ---------------- */
  var TC = (function(){
    var CFG_KEY = 'kx_racing_tc_cfg', USE_KEY = 'kx_racing_tc_use';
    var cfg = {on:false, min:15};                 /* 本机缓存（离线时兜底） */
    var use = {d:'', used:0, lock:'', hist:{}};
    var cloudCfg = null, cloudOthers = 0;        /* 云端配置 + 其它终端今日赛车合计秒数 */
    var triggered = false, warned5 = false, warned1 = false, saveT = 0, frozenByTC = false;
    function today(){
      var d = new Date();
      return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    }
    function loadCfg(){
      try{
        var c = JSON.parse(localStorage.getItem(CFG_KEY)||'null');
        if(c && typeof c==='object'){ cfg.on = !!c.on; cfg.min = clamp(Number(c.min)||0, 0, 600); }
      }catch(e){}
    }
    function loadUse(){
      try{
        var u = JSON.parse(localStorage.getItem(USE_KEY)||'null');
        if(u && typeof u==='object') use = u;
      }catch(e){}
      if(!use.hist || typeof use.hist!=='object') use.hist = {};
      if(use.d !== today()){
        if(use.d) use.hist[use.d] = Math.round(Number(use.used)||0);
        var ks = Object.keys(use.hist).sort();
        while(ks.length > 14) delete use.hist[ks.shift()];
        use.d = today(); use.used = 0; use.lock = '';
        saveUse();
      }
    }
    function saveUse(){ try{ localStorage.setItem(USE_KEY, JSON.stringify(use)); }catch(e){} }
    function C(){
      return cloudCfg || {on:cfg.on, min:cfg.min, lock:use.lock||''};
    }
    function limitSec(){ var c=C(); return (c.on && c.min>0) ? c.min*60 : Infinity; }
    function lockedToday(){ var c=C(); return !!c.lock && c.lock >= today(); }
    function remaining(){
      var lim = limitSec();
      /* 全部终端合计 = 其它终端已上报的秒数 + 本机这一份（实时）；已取消临时加时 */
      return lim===Infinity ? Infinity : lim - (Number(use.used)||0) - cloudOthers;
    }
    /* 只按真实条件判断。triggered 只是"遮罩已弹出"的标记，混进来的话
       家长清零后 blocked() 会恒为 true，页面永远解不开锁。 */
    function blocked(){ return lockedToday() || remaining() <= 0; }
    function freezeIfPlaying(){ if(state === 'playing'){ frozenByTC = true; state = 'over'; } }
    function show(){
      var locked = lockedToday(), c = C();
      el('lockTitle').textContent = locked ? '小车睡觉啦' : '时间到啦';
      el('lockDesc').innerHTML = locked
        ? '爸爸妈妈说今天先不开车啦。<br>和蹦蹦兔拉拉勾，<b>明天再来</b>哦！'
        : '今天的小赛车时间用完啦（一共 <b>'+c.min+' 分钟</b>）。<br>眼睛和小手都要休息，<b>明天再来开</b>哦！';
      el('lockBtn').textContent = blocked() ? '跟蹦蹦兔拉拉勾' : '继续开！';
      el('lockCard').classList.remove('hide');
    }
    function hideResume(){
      triggered = false;
      el('lockCard').classList.add('hide');
      /* 只恢复"因时间到而冻结"的局；通关结算的 over 不能误恢复成游戏中 */
      if(frozenByTC && state === 'over'){ state = 'playing'; last = performance.now(); }
      frozenByTC = false;
    }
    function playTimeup(){
      try{ KX_TTS.speak('时间到啦！休息一下吧'); }catch(e){}
    }
    function playWarn(){
      try{ KX_TTS.speak('还剩最后十秒啦，加油！'); }catch(e){}
    }
    function trigger(){
      if(triggered) return;
      triggered = true;
      saveUse();
      if(window.KX_CLOUD) KX_CLOUD.report('racing', Number(use.used)||0);
      try{ KX_TTS.stop(); }catch(e){}
      freezeIfPlaying();
      show();
      playTimeup();
    }
    function tick(dt){
      if(state !== 'playing' || document.hidden) return;
      var rem = remaining();
      if(rem === Infinity) return;
      use.used = (Number(use.used)||0) + dt;
      rem = remaining();
      if(rem <= 0){ trigger(); return; }
      if(!warned5 && rem <= 300 && rem > 60){ warned5 = true; toast('还有 5 分钟就要休息啦'); }
      if(!warned1 && rem <= 60 && rem > 0){ warned1 = true; toast('还有 1 分钟就要休息啦'); playWarn(); }
      saveT += dt;
      if(saveT >= 5){ saveT = 0; saveUse(); }
    }
    function init(){
      loadCfg(); loadUse();
      if(blocked()){ triggered = true; freezeIfPlaying(); show(); }
    }
    /* 管理端在本机改了设置（storage 事件跨页通知）→ 重新读取并热生效 */
    function reload(){
      var wasShown = triggered || !el('lockCard').classList.contains('hide');
      triggered = false; warned5 = false; warned1 = false;
      loadCfg(); loadUse();
      if(blocked()){ triggered = true; freezeIfPlaying(); show(); }
      else if(wasShown) hideResume();
    }
    /* 云端同步回来：只更新数据与遮罩状态，不重置提醒标记（否则每 15 秒会重复提醒） */
    function cloudUpdate(c, others){
      cloudCfg = c || null;
      cloudOthers = Math.max(0, Number(others)||0);
      if(cloudCfg){
        try{ localStorage.setItem(CFG_KEY, JSON.stringify({on:cloudCfg.on, min:cloudCfg.min})); }catch(e){}
      }
      if(blocked()){
        if(!triggered) trigger();
        else if(!el('lockCard').classList.contains('hide')) show();
      }else if(triggered || !el('lockCard').classList.contains('hide')){
        hideResume();   /* 额度恢复了就自动放开，不必家长再手动解锁 */
      }
    }
    function info(){
      var c=C();
      return {on:c.on, min:c.min, used:Math.round(use.used),
              lock:c.lock||'', others:Math.round(cloudOthers), cloud:!!cloudCfg,
              today:today(), remaining:remaining(),
              blocked:blocked(), triggered:triggered, warned:[warned5, warned1]};
    }
    return {init:init, tick:tick, reload:reload, show:show, hideResume:hideResume,
            cloudUpdate:cloudUpdate,
            blocked:blocked, remaining:remaining, info:info, _keys:{CFG_KEY:CFG_KEY, USE_KEY:USE_KEY}};
  })();

  function start(lv){
    if(TC.blocked()){ TC.show(); return; }
    if(typeof lv === 'number') curLv = clamp(lv, 0, Math.min(progress.unlocked, LEVELS.length-1));
    GOAL = L().goal;
    initSound(); sfxClick();
    reset();
    closeKnow();
    el('startCard').classList.add('hide');
    el('endCard').classList.add('hide');
    state = 'playing'; last = performance.now();
  }
  function finish(){
    state = 'over';
    closeKnow();
    sfxWin();
    spawnConfetti();
    var perfect = (bumps===0);
    var prev = progress.best[curLv];
    var isBest = (prev === undefined || bumps < prev);
    if(isBest) progress.best[curLv] = bumps;
    var hasNext = curLv < LEVELS.length-1;
    if(hasNext && progress.unlocked < curLv+1) progress.unlocked = curLv+1;
    saveProgress();
    var lastLv = (curLv === LEVELS.length-1);
    el('endStamp').textContent = lastLv ? '～ 全部通关啦 ～' : (perfect ? '～ 完美通过 ～' : '～ 第'+cnNum(curLv+1)+'关 通过啦 ～');
    el('endTitle').textContent = lastLv ? '赛车小冠军！' : (perfect ? '完美开车手！' : (bumps<=2?'好棒呀！':'到终点啦！'));
    el('endResult').innerHTML = '第'+cnNum(curLv+1)+'关「'+L().name+'」收到 <b>'+GOAL+'</b> 颗星星！<br>路上捡到金币 <b>'+coins+'</b> 枚（一共攒了 '+coinTotal+' 枚）<br>碰到锥桶 <b>'+bumps+'</b> 次'
      + (perfect ? '<br>整关一次都没碰到，<b>金星星给你！</b>' : '')
      + (lastLv ? '，二十关全部开完啦。' : (hasNext ? '，<b>下一关解锁啦</b>！' : '。'));
    el('nextBtn').textContent = lastLv ? '再玩第一关' : '开第'+cnNum(curLv+2)+'关';
    el('bestTxt').textContent = isBest ? '这一关的最好成绩：只碰到 '+bumps+' 次' : '这一关最好成绩：只碰到 '+prev+' 次';
    el('endCard').classList.remove('hide');
  }
  function collide(it){
    var hw = player.w*.36, hh = player.h*.36;
    var r = it.type==='star'||it.type==='know'||it.type==='coin'||it.type==='boost'||it.type==='magnet' ? it.r : 13*(it.s||1);
    return Math.abs(it.x-player.x) < hw+r && Math.abs(it.y-player.y) < hh+r;
  }
  function showKnow(k){
    knowCount++;
    sfxKnow();
    el('knowTxt').textContent = KNOWS[k];
    el('knowCard').classList.remove('hide');
    clearTimeout(knowTimer);
    try{
      KX_TTS.speak(KNOWS[k], { onend: function(){ knowTimer = setTimeout(closeKnow, 1200); } });
    }catch(e){ knowTimer = setTimeout(closeKnow, 6000); }
    knowTimer = setTimeout(closeKnow, 20000); /* 兜底：极端情况下 20 秒后收起 */
  }
  function closeKnow(){
    clearTimeout(knowTimer);
    KX_TTS.stop();
    el('knowCard').classList.add('hide');
  }
  function update(dt){
    elapsed += dt;
    var speed = (L().speed + Math.min(stars,GOAL)*4.5) * (slow>0?.55:1) * (boost>0?1.55:1);
    offset += speed*dt;
    if(slow>0) slow -= dt;
    if(inv>0) inv -= dt;
    if(boost>0) boost -= dt;
    if(magnet>0) magnet -= dt;
    /* 尾气小云朵：车屁股冒烟（加速时喷火焰） */
    exhT -= dt;
    if(exhT <= 0){
      exhT = boost>0 ? .05 : .09;
      if(boost>0){
        parts.push({x:player.x+rand(-4,4), y:player.y+player.h*.52, r:rand(3,6),
                    vx:rand(-26,26), vy:rand(120,220), life:.5,
                    color:['#D96A52','#F2C14E','#FFF3D6'][(Math.random()*3)|0]});
      }else{
        parts.push({x:player.x-player.w*.42+rand(-3,3), y:player.y+player.h*.46, r:rand(2.6,5),
                    vx:rand(-30,-10), vy:rand(46,88), life:.7, color:'rgba(252,250,244,.85)'});
      }
    }
    /* 加速时的斜向速度线 */
    if(boost>0 && Math.random()<.5){
      parts.push({x:rand(roadL(),roadR()), y:-6, r:rand(1.2,2.2), vx:rand(-14,14),
                  vy:speed*1.5, life:.6, color:'rgba(255,255,255,.75)'});
    }
    /* 路边探头小动物 */
    if(peek){
      peek.t -= dt;
      if(peek.t<=0) peek = null;
    }

    var dir = (keys.right?1:0)-(keys.left?1:0);
    if(dragging){
      player.x += (dragX-player.x)*Math.min(1,dt*16);
      player.tilt = clamp((dragX-player.x)*.004,-.16,.16);
    }else if(dir){
      player.x += dir*clamp(W*.95,260,420)*dt;
      player.tilt += (dir*.10-player.tilt)*Math.min(1,dt*10);
    }else player.tilt += (0-player.tilt)*Math.min(1,dt*10);
    player.x = clamp(player.x, roadL()+player.w*.55, roadR()-player.w*.55);

    spawnT -= dt;
    if(spawnT<=0){ spawn(); spawnT = rand(L().gap*.82, L().gap*1.18); }

    for(var i=items.length-1;i>=0;i--){
      var it = items[i];
      it.y += speed*dt;
      /* 磁铁时间：附近的星星和金币自己飞过来 */
      if(magnet>0 && (it.type==='star'||it.type==='coin') && Math.abs(it.y-player.y)<210){
        it.x += (player.x-it.x)*Math.min(1,dt*3.4);
        it.y += (player.y-it.y)*Math.min(1,dt*2.4);
      }
      if(it.hit){ items.splice(i,1); continue; }
      if(collide(it)){
        if(it.type==='star'){
          stars++; combo++;
          var mul = 1 + Math.min(combo,10)*.05;
          sfxStar(mul); burst(it.x,it.y,'#F2C14E');
          addFloat(it.x,it.y-14, combo>=2 ? '+1 ×'+combo : '+1', combo>=5?'#C4543F':'#B98A2E');
          toast(combo>=3 ? '连击 ×'+combo+'！真厉害！' : '接到一颗星星！');
          items.splice(i,1); updateHUD();
          if(stars>=GOAL){ finish(); return; }
          continue;
        }else if(it.type==='gift'){
          stars++; combo++;
          burstMany(it.x,it.y,['#E8A9C0','#F0C24E','#A8CBA0','#9FC5D9'],14);
          sfxGift(); addFloat(it.x,it.y-14,'礼物！+1','#C96A8E');
          toast('礼物盒里蹦出一颗星星！');
          items.splice(i,1); updateHUD();
          if(stars>=GOAL){ finish(); return; }
          continue;
        }else if(it.type==='ice'){
          slow = 6;
          burstMany(it.x,it.y,['#FFF4E4','#F0C24E','#D8E6F5'],10);
          sfxIce(); addFloat(it.x,it.y-14,'凉快～','#5B87B5');
          toast('冰冰凉凉，慢慢开一小会儿～');
          items.splice(i,1); continue;
        }else if(it.type==='know'){
          burst(it.x,it.y,'#7FA8D9');
          items.splice(i,1);
          showKnow(it.k);
          continue;
        }else if(it.type==='coin'){
          addCoin(1);
          sfxCoin();
          burstMany(it.x,it.y,['#F2C14E','#E8A23C','#FFF3D6'],9);
          addFloat(it.x,it.y-14,'金币 +1','#B8860B');
          items.splice(i,1); updateHUD(); continue;
        }else if(it.type==='boost'){
          boost = 3.5; inv = Math.max(inv,3.5);
          burstMany(it.x,it.y,['#D96A52','#F2C14E','#9FC5D9','#FFF'],16);
          sfxBoost();
          addFloat(it.x,it.y-14,'嗖——加速！','#C4543F');
          toast('火箭加速！这一段谁也撞不到你～');
          items.splice(i,1); continue;
        }else if(it.type==='magnet'){
          magnet = 6;
          burstMany(it.x,it.y,['#C4543F','#7FA8D9','#FFF3D6'],12);
          sfxGift();
          addFloat(it.x,it.y-14,'吸铁石！','#C4543F');
          toast('磁铁来啦，星星和金币自己飞过来！');
          if(window.KX_FUN) KX_FUN.hit(true);
          items.splice(i,1); continue;
        }else if(inv<=0){
          bumps++; combo = 0; inv = 1.25; slow = .8; sfxBump(); burst(it.x,it.y,'#E08A54');
          toast('哎呀，慢一点～'); updateHUD();
          items.splice(i,1); continue;
        }
      }
      if(it.y > H+50) items.splice(i,1);
    }
    /* 飘字上浮 */
    for(var fi=floats.length-1;fi>=0;fi--){
      var f = floats[fi];
      f.y -= 34*dt; f.life -= dt*1.05;
      if(f.life<=0) floats.splice(fi,1);
    }
    for(var j=parts.length-1;j>=0;j--){
      var p = parts[j];
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 300*dt; p.life -= dt*1.8;
      if(p.life<=0) parts.splice(j,1);
    }
  }
  function loop(now){
    raf = requestAnimationFrame(loop);
    var dt = Math.min(.05,(now-last)/1000||0); last = now;
    if(state==='playing'){ update(dt); TC.tick(dt); }
    else{
      offset += 26*dt; elapsed += dt;
      updateAmbient(dt);
    }
    /* over 时彩纸继续飘落 */
    for(var i=confetti.length-1;i>=0;i--){
      var c = confetti[i];
      c.x += c.vx*dt; c.y += c.vy*dt; c.rot += c.vr*dt; c.life -= dt*.5;
      if(c.y > H+16 || c.life<=0) confetti.splice(i,1);
    }
    draw();
  }

  /* ---------------- 操作 ---------------- */
  function pointX(e){
    var r = stage.getBoundingClientRect();
    var t = (e.touches&&e.touches[0]) || (e.changedTouches&&e.changedTouches[0]) || e;
    return clamp(t.clientX-r.left, roadL()+player.w*.55, roadR()-player.w*.55);
  }
  function onDown(e){
    if(state!=='playing') return;
    dragging = true; dragX = pointX(e);
    if(e.cancelable) e.preventDefault();
  }
  function onMove(e){
    if(!dragging || state!=='playing') return;
    dragX = pointX(e);
    if(e.cancelable) e.preventDefault();
  }
  function onUp(){ dragging = false; }
  stage.addEventListener('touchstart',onDown,{passive:false});
  stage.addEventListener('touchmove',onMove,{passive:false});
  stage.addEventListener('touchend',onUp);
  stage.addEventListener('touchcancel',onUp);
  stage.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);

  /* 方向控制：手指直接拖小车（stage 上的 touch/mouse 事件），键盘左右键也可用 */
  /* ---------------- 喇叭彩蛋：嘀嘀一声，路边小动物探头 ---------------- */
  var hornBtn = el('hornBtn'), hornTimer = 0;
  function honk(){
    if(state!=='playing') return;
    sfxHorn();
    hornBtn.classList.add('honk');
    clearTimeout(hornTimer);
    hornTimer = setTimeout(function(){ hornBtn.classList.remove('honk'); }, 750);
    var names = ['小兔子','小熊','小猫咪'];
    if(!peek){
      peek = {side: Math.random()<.5?'L':'R', kind:(Math.random()*3)|0, t:1.8};
      toast('嘀嘀！'+names[peek.kind]+'从路边探出头来～');
    }else{
      peek.t = 1.8;
    }
  }
  hornBtn.addEventListener('touchstart',function(e){ e.stopPropagation(); honk(); if(e.cancelable) e.preventDefault(); },{passive:false});
  hornBtn.addEventListener('mousedown',function(e){ e.stopPropagation(); honk(); });
  /* ---------------- 选小车 ---------------- */
  function renderCarPick(){
    var box = el('carPick');
    box.innerHTML = '';
    CARS.forEach(function(c,i){
      var b = document.createElement('button');
      b.className = 'car-btn' + (i===myCar?' on':'');
      b.setAttribute('aria-label', c.name);
      var mini = document.createElement('canvas');
      mini.width = 46; mini.height = 52;
      var label = document.createElement('div');
      label.className = 'cname'; label.textContent = c.name;
      b.appendChild(mini); b.appendChild(label);
      b.addEventListener('click', function(){
        if(myCar !== i){
          myCar = i;
          try{ localStorage.setItem(CAR_KEY, String(i)); }catch(e){}
          sfxClick();
          renderCarPick();
          updateHUD();
        }
      });
      box.appendChild(b);
      var g2 = mini.getContext('2d');
      drawCar(g2, 23, 27, 26, 38, c.body, 0, '#CFE7EF', c);
    });
  }
  el('knowClose').addEventListener('click', closeKnow);
  renderCarPick();
  renderMap();
  window.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=true;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=true;
    if((e.key===' '||e.key==='Enter') && state!=='playing' && state!=='map'){ start(curLv); }
  });
  window.addEventListener('keyup',function(e){
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=false;
  });
  document.addEventListener('visibilitychange',function(){ last = performance.now(); });

  el('nextBtn').addEventListener('click',function(){
    var lastLv = (curLv === LEVELS.length-1);
    start(lastLv ? 0 : curLv+1);
  });
  el('againBtn').addEventListener('click',function(){ start(curLv); });
  el('mapBtn').addEventListener('click',showMap);
  el('shopBtn').addEventListener('click',openShop);
  el('shopClose').addEventListener('click',closeShop);
  el('shopCard').addEventListener('click',function(e){ if(e.target===el('shopCard')) closeShop(); });
  window.addEventListener('resize',resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* 测试钩子（线上无影响） */
  window.RACING_DEBUG = {
    start:start, update:update, spawn:spawn, honk:honk, addCoin:addCoin,
    items:function(){ return items; }, player:function(){ return player; },
    tc:TC, shop:function(){ return {owned:shop.owned.slice(),equip:shop.equip,coins:coinTotal,magnet:magnet}; },
    buyGood:buyGood, openShop:openShop,
    info:function(){ return {state:state, stars:stars, coins:coins, coinTotal:coinTotal,
                             boost:boost, knowCount:knowCount, peek:!!peek}; }
  };
  /* 使用时长统计：赛车只算真正在开车的时间，停在选关画面不占额度 */
  if(window.KX_USAGE) KX_USAGE.setActive(function(){ return state === 'playing'; });
  /* 云端同步：配置与其它终端的今日时长，进页面立刻拉，之后每 15 秒拉一次 */
  if(window.KX_CLOUD){
    function pullCloud(){
      KX_CLOUD.sync().then(function(res){
        if(!res) return;
        if(res.reset) TC.reload();
        TC.cloudUpdate(res.cfg, (res.usage && res.usage.others && res.usage.others.racing) || 0);
      });
    }
    pullCloud();
    setInterval(pullCloud, 15000);
  }

  el('lockBtn').addEventListener('click',function(){
    if(TC.blocked()){
      try{ KX_TTS.speak('时间到啦！休息一下吧'); }catch(e){}
    }else{
      TC.hideResume();
    }
  });
  /* 主页家长控制台改动设置后跨页热生效 */
  window.addEventListener('storage',function(e){
    if(e.key===TC._keys.CFG_KEY || e.key===TC._keys.USE_KEY) TC.reload();
  });

  resize(); updateHUD(); renderMap(); TC.init(); last = performance.now(); raf = requestAnimationFrame(loop);
})();
</script>

    -webkit-tap-highlight-color:transparent;user-select:none;animation:bunnyBob 2.8s ease-in-out infinite}
  @keyframes bunnyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  #bunny.jump{animation:bunnyJump .5s ease}
  @keyframes bunnyJump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16px) scale(1.1)}70%{transform:translateY(0) scale(.93)}100%{transform:translateY(0) scale(1)}}
  #bunnySay{position:absolute;bottom:64px;right:0;min-width:120px;background:#FFFDF4;border:2px solid #E8A9C0;
    border-radius:12px;padding:6px 10px;font-size:13px;color:#7A4A55;opacity:0;transform:translateY(6px);
    transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 4px 0 rgba(200,90,74,.12);

</style>

  </svg>
  <div id="bunnySay"></div>
</div>
<script>
(function(){
  var SAYS=['你好呀！','今天真棒！','一起玩吧！','我最喜欢你啦！','再玩一次吧！','你是最厉害的！'];
  var PRAISE=['你真棒！','太厉害啦！','好聪明呀！','真不错哦！','可心最棒啦！'];
  var timer=0;
  var box=document.getElementById('bunny'),say=document.getElementById('bunnySay');
  if(!box||!say) return;
  /* 全屏彩纸（完成大事时用） */
  window.partyBurst=function(n){
    var colors=['#E8A9C0','#F0C24E','#A8CBA0','#9FC5D9','#D9A8E0','#F0A98C'];
    n=n||32;
    for(var i=0;i<n;i++){
      var c=document.createElement('i');
      c.className='party-bit';
      c.style.left=(Math.random()*94+3)+'vw';
      c.style.background=colors[i%colors.length];
      c.style.animation='partyFall '+(2.2+Math.random()*1.6).toFixed(2)+'s '+(Math.random()*.5).toFixed(2)+'s linear forwards';
      c.style.setProperty('--drift',((Math.random()*180-90)|0)+'px');
      c.style.setProperty('--spin',((Math.random()*720-360)|0)+'deg');
      document.body.appendChild(c);
      (function(el){ setTimeout(function(){ el.remove(); },4800); })(c);
    }
  };
  /* 随机表扬语音 */
  window.praiseOnce=function(){
    try{
      KX_TTS.speak(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
    }catch(e){}
  };
  box.addEventListener('click',function(){
    box.classList.remove('jump'); void box.offsetWidth; box.classList.add('jump');
    say.textContent=SAYS[Math.floor(Math.random()*SAYS.length)];
    say.classList.add('show');
    clearTimeout(timer); timer=setTimeout(function(){ say.classList.remove('show'); },2600);
    try{
      KX_TTS.speak(Math.random()<.45?'你好呀，可心！':PRAISE[Math.floor(Math.random()*PRAISE.length)]);
    }catch(e){}
  });
})();
</script>
